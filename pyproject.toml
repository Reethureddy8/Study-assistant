[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parishiksha"
version = "2.1.0"
description = "Grounded RAG study assistant for NCERT Class 9 Science"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
parishiksha = "parishiksha.cli:main"

[tool.setuptools]
packages = ["parishiksha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
